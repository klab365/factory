name = "feature"
[[inputs]]
key = "issue_url"
description = "GitHub issue URL in the form https://github.com/owner/repo/issues/123"

[[steps]]
id = "issue-intake"
type = "shell"
command = "gh"
args = ["issue", "view", "{{issue_url}}", "--json", "url,number,title,body,labels"]

[[steps.transitions]]
outcome = "success"
target_step = "planner"

[[steps]]
id = "planner"
type = "agent"
agent = "planner"

[[steps.transitions]]
outcome = "success"
target_step = "build"

[[steps]]
id = "build"
type = "agent"
agent = "coder"

[[steps.transitions]]
outcome = "success"
target_step = "review"

[[steps.transitions]]
outcome = "failure"
target_step = "review"

[[steps]]
id = "review"
type = "agent"
agent = "reviewer"

[[steps.transitions]]
outcome = "changes_requested"
target_step = "build"

[[steps.transitions]]
outcome = "approved"
target_step = "test"

[[steps]]
id = "test"
type = "shell"
command = "mise"
args = ["test"]
