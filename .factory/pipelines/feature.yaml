name: feature
inputs:
  - key: issue_url
    description: GitHub issue URL in the form https://github.com/owner/repo/issues/123

steps:
  - id: issue-intake
    type: shell
    command: gh
    args: [issue, view, "{{issue_url}}", --json, "url,number,title,body,labels"]
    transitions:
      - outcome: success
        target_step: planner

  - id: planner
    type: agent
    agent: planner
    transitions:
      - outcome: success
        target_step: build

  - id: build
    type: agent
    agent: coder
    transitions:
      - outcome: success
        target_step: review
      - outcome: failure
        target_step: review

  - id: review
    type: agent
    agent: reviewer
    transitions:
      - outcome: changes_requested
        target_step: build
      - outcome: approved
        target_step: test

  - id: test
    type: shell
    command: mise
    args: [test]
    transitions:
      - outcome: success
        target_step: publish

  - id: publish
    type: agent
    agent: publisher
