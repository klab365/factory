name: feature
inputs:
  - key: issue_url
    description: GitHub issue URL in the form https://github.com/owner/repo/issues/123

steps:
  - id: issue-intake
    type: shell
    command: gh
    args: [issue, view, "{{issue_url}}", --json, "url,number,title,body,labels"]
    transitions:
      - outcome: success
        target_step: planner

  - id: planner
    type: agent
    agent: planner
    context:
      task:
        from: run.task
      issue_url:
        from: inputs.issue_url
      issue:
        from: steps.issue-intake.output
    transitions:
      - outcome: success
        target_step: build

  - id: build
    type: agent
    agent: coder
    context:
      task:
        from: run.task
      issue:
        from: steps.issue-intake.output
      plan:
        from: steps.planner.output
      review_feedback:
        from: steps.review.handoff
        optional: true
      human_feedback:
        from: steps.approval.handoff.answer
        optional: true
      validation_feedback:
        from: steps.validate.output
        optional: true
    transitions:
      - outcome: success
        target_step: validate
      - outcome: failure
        target_step: review

  - id: validate
    type: shell
    command: sh
    args: [-c, "mise run fmt && mise run lint && mise run test && mise run build"]
    transitions:
      - outcome: success
        target_step: review
      - outcome: failure
        target_step: build

  - id: review
    type: agent
    agent: reviewer
    context:
      task:
        from: run.task
      issue:
        from: steps.issue-intake.output
      coder_summary:
        from: steps.build.output
      human_feedback:
        from: steps.approval.handoff.answer
        optional: true
    transitions:
      - outcome: changes_requested
        target_step: build
      - outcome: approved
        target_step: approval

  - id: approval
    type: human
    prompt: |
      Formatierung, Clippy, Tests und Build sind erfolgreich. Gib konkretes Feedback
      ein, wenn noch etwas geändert werden soll. Der Coder setzt es um und danach
      laufen Validierung und Review erneut.
      Antworte exakt mit `approved`, wenn alles passt und ich committen, pushen und
      einen Pull Request erstellen darf.
    approval_keyword: approved
    transitions:
      - outcome: feedback
        target_step: build
      - outcome: approved
        target_step: publish

  - id: publish
    type: agent
    agent: publisher
    context:
      task:
        from: run.task
      issue_url:
        from: inputs.issue_url
      test_result:
        from: steps.validate.output
      review_result:
        from: steps.review.output
