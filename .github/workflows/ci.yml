name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Mise and Rust
        uses: jdx/mise-action@v2

      - name: Check formatting
        run: mise run fmt

      - name: Run Clippy
        run: mise run lint

      - name: Run tests
        run: mise run test

      - name: Build workspace
        run: mise run build
